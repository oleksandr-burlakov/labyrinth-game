<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Maze Online</title>
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #game-container {
        width: min(100vw, 1000px);
        height: 100dvh;
        max-height: 900px;
        border: 2px solid #54616d;
        box-sizing: border-box;
        touch-action: none;
      }
      #orientation-overlay { display: none; }
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 700px) {
        #game-container { visibility: hidden; }
        #orientation-overlay { display: flex; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box; color: #fff; background: #111; text-align: center; font-size: 20px; line-height: 1.4; }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #game-container { width: 100vw; height: 100dvh; max-width: none; max-height: none; border: 0; }
        #menu-form { padding: 12px !important; }
        #menu-form .menu-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #menu-form input, #menu-form select { width: 170px !important; padding: 7px !important; }
        #menu-form br { display: none; }
        #menu-form .menu-actions { margin-top: 10px; }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="orientation-overlay">Rotate your device to landscape to play Maze Online.</div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
