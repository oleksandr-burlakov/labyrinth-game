<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Maze Online</title>
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #game-container {
        width: min(100vw, 1000px);

        max-height: 900px;
        border: 2px solid #54616d;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
